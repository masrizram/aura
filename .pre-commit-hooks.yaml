- id: aura-audit
  name: AURA Autonomous Audit
  description: Run continuous autonomous audit engine to validate project state
  entry: pwsh -NoProfile -File src/engine/run-audit.ps1 -Action validate-state -ForceValidation
  language: system
  pass_filenames: false
  always_run: true
  fail_fast: false
  verbose: true
  stages: [commit, push]
  require_serial: true

- id: aura-invariant-check
  name: AURA Business Invariant Check
  description: Validate business invariants are intact
  entry: pwsh -NoProfile -File src/engine/run-audit.ps1 -Action invariant-check
  language: system
  pass_filenames: false
  always_run: true
  stages: [commit]
  require_serial: true

- id: aura-scope-check
  name: AURA Scope Validation
  description: Verify audit scope coverage meets thresholds
  entry: pwsh -NoProfile -File src/engine/run-audit.ps1 -Action scope-check
  language: system
  pass_filenames: false
  always_run: true
  stages: [push]
  require_serial: true

- id: aura-evidence-check
  name: AURA Evidence Integrity
  description: Verify evidence package integrity
  entry: pwsh -NoProfile -File src/engine/run-audit.ps1 -Action evidence-check
  language: system
  pass_filenames: false
  always_run: false
  stages: [push]
  require_serial: true