name: AURA Engine CI
on:
  push:
    paths:
      - 'src/**'
      - 'config/**'
      - 'bin/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'bin/**'
      - 'tests/**'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax Check
        run: |
          Get-ChildItem -Path src -Filter *.ps1 -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $null = [System.Management.Automation.PSParser]::Tokenize($content, [ref]$null)
            Write-Host "PASS: $($_.FullName)"
          }
        shell: powershell
      - name: Module Integrity
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src/engine/run-audit.ps1 -Action status
      - name: Pester Unit Tests
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction SilentlyContinue
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction SilentlyContinue
          Invoke-Pester -Path tests/engine/engine.tests.ps1 -Output Detailed
        shell: powershell
      - name: Pester Integration Tests
        run: |
          Invoke-Pester -Path tests/engine/integration.tests.ps1 -Output Detailed
        shell: powershell
      - name: Pester E2E Tests
        run: |
          Invoke-Pester -Path tests/engine/e2e.tests.ps1 -Output Detailed
        shell: powershell

  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run Python Tests
        run: python -m pytest tests/python/ -v