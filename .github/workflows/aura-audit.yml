name: AURA Autonomous Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      full_audit:
        description: 'Run full audit (ignore incremental mode)'
        type: boolean
        default: false
      multi_agent:
        description: 'Enable multi-agent audit mode'
        type: boolean
        default: false
      language:
        description: 'Audit language'
        type: choice
        options: [en, id]
        default: en

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write

env:
  AURA_STATE_DIR: .aura/state
  AURA_REPORT_DIR: .aura/reports
  AURA_CONFIG: config/aura.json

concurrency:
  group: aura-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aura-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      convergence_score: ${{ steps.audit.outputs.convergence_score }}
      p0_count: ${{ steps.post-results.outputs.p0_count }}
      p1_count: ${{ steps.post-results.outputs.p1_count }}
      p2_count: ${{ steps.post-results.outputs.p2_count }}
      audit_passed: ${{ steps.audit.outputs.audit_passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore AURA state cache
        uses: actions/cache@v4
        id: aura-state-cache
        with:
          path: |
            .aura/state
            .aura/reports
          key: aura-state-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            aura-state-${{ github.ref_name }}-
            aura-state-

      - name: Verify AURA prerequisites
        run: |
          if (!(Test-Path "src/engine/run-audit.ps1")) {
            Write-Error "AURA engine not found: src/engine/run-audit.ps1"
            exit 1
          }
          Write-Host "AURA engine v$(Get-Content config/aura.json | ConvertFrom-Json | Select-Object -ExpandProperty engine | Select-Object -ExpandProperty version) detected"
        shell: pwsh

      - name: Run AURA Audit
        id: audit
        env:
          AURA_FULL_AUDIT: ${{ github.event.inputs.full_audit || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $auditArgs = @(
            "-Action", "run",
            "-Language", "${{ github.event.inputs.language || 'en' }}"
          )
          if ("${{ github.event.inputs.multi_agent }}" -eq "true") {
            $auditArgs += "-MultiAgent"
          }
          if ("${{ github.event.inputs.full_audit }}" -eq "true") {
            $auditArgs += "-Force"
          }
          & "pwsh" -NoProfile -File "src/engine/run-audit.ps1" @auditArgs
          $auditExit = $LASTEXITCODE

          $convergencePath = ".aura/state/convergence.json"
          if (Test-Path $convergencePath) {
            $conv = Get-Content $convergencePath -Raw | ConvertFrom-Json
            $score = if ($conv.overall_score) { $conv.overall_score } else { 0 }
            $passed = if ($conv.converged -eq $true) { "true" } else { "false" }
            "convergence_score=$score" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "audit_passed=$passed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "convergence_score=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "audit_passed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          if ($auditExit -ne 0) {
            Write-Warning "AURA audit exited with code $auditExit"
          }
        shell: pwsh

      - name: Post results as PR comment
        id: post-results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const convergencePath = '.aura/state/convergence.json';
            const findingsPath = '.aura/state/findings.json';
            const ledgerPath = '.aura/reports/audit-ledger.md';

            let body = '## AURA Autonomous Audit Results\n\n';

            let p0Count = 0, p1Count = 0, p2Count = 0, totalFindings = 0;

            if (fs.existsSync(findingsPath)) {
              const findings = JSON.parse(fs.readFileSync(findingsPath, 'utf-8'));
              const openFindings = Array.isArray(findings)
                ? findings.filter(f => f.status === 'OPEN' || f.status === 'IN_PROGRESS')
                : (findings.findings || []).filter(f => f.status === 'OPEN' || f.status === 'IN_PROGRESS');

              p0Count = openFindings.filter(f => f.severity === 'P0').length;
              p1Count = openFindings.filter(f => f.severity === 'P1').length;
              p2Count = openFindings.filter(f => f.severity === 'P2').length;
              totalFindings = openFindings.length;

              body += `| Severity | Count |\n| --- | --- |\n`;
              body += `| P0 (Catastrophic) | ${p0Count} |\n`;
              body += `| P1 (Critical)      | ${p1Count} |\n`;
              body += `| P2 (High)          | ${p2Count} |\n`;
              body += `| P3-P5 (Lower)      | ${openFindings.filter(f => ['P3','P4','P5'].includes(f.severity)).length} |\n\n`;

              if (openFindings.length > 0) {
                body += '### Open Findings\n\n';
                for (const f of openFindings.slice(0, 15)) {
                  body += `- **${f.severity}** [${f.id || 'N/A'}] ${f.title || f.description?.substring(0, 100) || 'Untitled'}\n`;
                }
                if (openFindings.length > 15) {
                  body += `\n*...and ${openFindings.length - 15} more findings*\n`;
                }
              }
            }

            let convergenceStatus = 'UNDEFINED';
            if (fs.existsSync(convergencePath)) {
              const conv = JSON.parse(fs.readFileSync(convergencePath, 'utf-8'));
              convergenceStatus = conv.converged ? 'CONVERGED' : 'NOT CONVERGED';
              body += `\n### Convergence Gate\n\n`;
              body += `**Status:** ${convergenceStatus}\n`;
              body += `**Score:** ${conv.overall_score || 0}\n`;
              if (conv.gates) {
                body += '\n| Gate | Status |\n| --- | --- |\n';
                for (const [gate, status] of Object.entries(conv.gates)) {
                  body += `| ${gate} | ${status ? 'PASS' : 'FAIL'} |\n`;
                }
              }
            }

            const gatePassed = p0Count === 0 && p1Count === 0 && p2Count === 0;

            if (gatePassed) {
              body += '\n### Gate Check\n\n:white_check_mark: **PASSED** — No P0, P1, or P2 findings remain.\n';
            } else {
              body += '\n### Gate Check\n\n:x: **BLOCKED** — P0-P2 findings still open. Cannot merge until resolved.\n';
            }

            if (fs.existsSync(ledgerPath)) {
              const ledger = fs.readFileSync(ledgerPath, 'utf-8');
              const summaryMatch = ledger.match(/## Summary\n([\s\S]*?)(?=\n## |$)/);
              if (summaryMatch) {
                body += `\n<details><summary>Audit Ledger Summary</summary>\n\n${summaryMatch[0]}\n</details>\n`;
              }
            }

            body += `\n---\n*Triggered by ${context.sha?.substring(0, 7) || 'commit'} on ${context.ref}*`;

            core.setOutput('p0_count', p0Count);
            core.setOutput('p1_count', p1Count);
            core.setOutput('p2_count', p2Count);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AURA Autonomous Audit Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

            if (gatePassed) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  state: 'success',
                  description: 'AURA audit converged — no P0-P2 findings',
                  context: 'aura/audit',
                });
              } catch (_) { }
            } else {
              try {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  state: 'failure',
                  description: `AURA audit blocked: ${p0Count} P0, ${p1Count} P1, ${p2Count} P2`,
                  context: 'aura/audit',
                });
              } catch (_) { }
            }

      - name: Upload AURA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-state-${{ github.sha }}
          path: |
            .aura/state/
            .aura/reports/
          retention-days: 7

  aura-convergence-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    needs: aura-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore AURA state cache
        uses: actions/cache@v4
        with:
          path: |
            .aura/state
            .aura/reports
          key: aura-state-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            aura-state-${{ github.ref_name }}-
            aura-state-

      - name: Validate convergence state
        id: validate
        run: |
          & "pwsh" -NoProfile -File "src/engine/run-audit.ps1" -Action validate-state -ForceValidation
          $exitCode = $LASTEXITCODE

          $findingsPath = ".aura/state/findings.json"
          if (Test-Path $findingsPath) {
            $findings = Get-Content $findingsPath -Raw | ConvertFrom-Json
            $arr = if ($findings -is [array]) { $findings } else { $findings.findings }
            if ($null -ne $arr) {
              $openP0 = ($arr | Where-Object { $_.status -in @('OPEN','IN_PROGRESS') -and $_.severity -eq 'P0' }).Count
              $openP1 = ($arr | Where-Object { $_.status -in @('OPEN','IN_PROGRESS') -and $_.severity -eq 'P1' }).Count
              $openP2 = ($arr | Where-Object { $_.status -in @('OPEN','IN_PROGRESS') -and $_.severity -eq 'P2' }).Count
              Write-Host "Open P0: $openP0  P1: $openP1  P2: $openP2"
              "open_p0=$openP0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "open_p1=$openP1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "open_p2=$openP2" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "total_open=$($openP0 + $openP1 + $openP2)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
          }

          if ($exitCode -ne 0) {
            Write-Error "Convergence validation failed (exit $exitCode)"
            exit $exitCode
          }
        shell: pwsh

      - name: Set merge gate status
        if: always()
        run: |
          $p0 = [int]"${{ steps.validate.outputs.open_p0 }}"
          $p1 = [int]"${{ steps.validate.outputs.open_p1 }}"
          $p2 = [int]"${{ steps.validate.outputs.open_p2 }}"

          if ($p0 -eq 0 -and $p1 -eq 0 -and $p2 -eq 0) {
            Write-Host "Convergence gate: PASSED"
          } else {
            Write-Error "Convergence gate: BLOCKED — $p0 P0, $p1 P1, $p2 P2 findings remain"
            exit 1
          }
        shell: pwsh