name: AURA Audit Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      max_cycles:
        description: "Maximum autonomous remediation cycles"
        default: "5"
        type: string

concurrency:
  group: aura-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  aura-audit:
    name: "AURA Audit & Convergence"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up semgrep
        uses: semgrep/semgrep-action@v1
        with:
          install-semgrep: true

      - name: Install AURA
        run: |
          pip install -e ".[dev]"

      - name: Check tools available
        run: |
          python --version
          git --version
          semgrep --version 2>/dev/null || echo "semgrep: not found"
          echo "Python deps:"
          pip list 2>/dev/null | grep -E "click|rich|pydantic|structlog" || true

      - name: Initialize AURA
        run: |
          python -m aura init
          echo "AURA initialized successfully."

      - name: Run AURA audit
        id: audit
        run: |
          python -m aura audit --json 2>/dev/null | tee aura_audit_result.json
          echo "audit_complete=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Parse convergence status
        id: convergence
        if: always() && steps.audit.outcome == 'success'
        run: |
          STATUS=$(python -c "
          import json, sys
          try:
              with open('aura_audit_result.json') as f:
                  data = json.load(f)
              print(data.get('classification', 'NOT_READY'))
          except Exception:
              print('INFRASTRUCTURE_FAILURE')
          ")
          echo "classification=$STATUS" >> $GITHUB_OUTPUT

          SCORE=$(python -c "
          import json
          try:
              with open('aura_audit_result.json') as f:
                  data = json.load(f)
              print(data.get('overall_score', 0))
          except Exception:
              print('0')
          ")
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Upload audit report artifact
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aura-audit-report
          path: |
            aura_audit_result.json
            .aura/state/
          retention-days: 30

      - name: Gate check — PRODUCTION_READY
        if: always() && steps.convergence.outcome == 'success'
        run: |
          if [ "${{ steps.convergence.outputs.classification }}" = "PRODUCTION_READY" ]; then
            echo "✅ AURA convergence gates ALL pass — PRODUCTION_READY (score: ${{ steps.convergence.outputs.score }})"
            echo "::notice title=AURA Convergence::PRODUCTION_READY - Score: ${{ steps.convergence.outputs.score }}/100"
          elif [ "${{ steps.convergence.outputs.classification }}" = "CONDITIONALLY_READY" ]; then
            echo "⚠️ AURA: CONDITIONALLY_READY (score: ${{ steps.convergence.outputs.score }}/100)"
            echo "::warning title=AURA Convergence::CONDITIONALLY_READY - Score: ${{ steps.convergence.outputs.score }}/100"
          elif [ "${{ steps.convergence.outputs.classification }}" = "INFRASTRUCTURE_FAILURE" ]; then
            echo "🔴 AURA: INFRASTRUCTURE_FAILURE — audit could not complete"
            echo "::error title=AURA Convergence::INFRASTRUCTURE_FAILURE — audit could not complete"
          else
            echo "❌ AURA: NOT_READY (score: ${{ steps.convergence.outputs.score }}/100)"
            echo "::warning title=AURA Convergence::NOT_READY - Score: ${{ steps.convergence.outputs.score }}/100"
          fi

      - name: Generate status badge comment (PR only)
        if: always() && github.event_name == 'pull_request' && steps.convergence.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const classification = '${{ steps.convergence.outputs.classification }}';
            const score = '${{ steps.convergence.outputs.score }}';
            const emoji = classification === 'PRODUCTION_READY' ? '🟢' :
                          classification === 'CONDITIONALLY_READY' ? '🟡' : '🔴';

            let body = `## ${emoji} AURA Audit — ${classification}\n\n`;
            body += `**Score:** ${score}/100\n\n`;
            body += `Classification: \`${classification}\`\n`;
            body += `[Download audit report](${{ steps.audit.outputs.artifact-url || '#' }})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  aura-test:
    name: "AURA Test Suite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AURA
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v --tb=short

      - name: Run lint
        run: python -m ruff check src/ --quiet || echo "Lint issues exist (non-blocking)"

  aura-benchmark:
    name: "AURA Benchmark Gate"
    runs-on: ubuntu-latest
    needs: [aura-test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AURA
        run: pip install -e ".[dev]"

      - name: Run benchmark v3 validation
        run: |
          python -c "
          from aura.benchmark_v3 import generate_benchmark_cases, BenchmarkRunner
          cases = generate_benchmark_cases()
          print(f'Generated {len(cases)} benchmark cases')
          # Verify benchmark framework integrity
          tp_count = len([c for c in cases if c.verdict.name == 'TRUE_POSITIVE'])
          mitigated_count = len([c for c in cases if c.verdict.name == 'MITIGATED'])
          advisory_count = len([c for c in cases if c.verdict.name == 'ADVISORY'])
          print(f'TP: {tp_count}, Mitigated: {mitigated_count}, Advisory: {advisory_count}')
          assert len(cases) >= 50, f'Insufficient cases: {len(cases)}'
          assert tp_count >= 10, 'Insufficient TP cases'
          print('Benchmark framework OK')
          "