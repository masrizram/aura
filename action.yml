name: 'AURA Autonomous Audit'
description: 'Run AURA autonomous audit engine on your code'
author: 'AURA Team'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  target:
    description: 'Target project path'
    required: false
    default: '.'
  multi_agent:
    description: 'Enable multi-agent audit mode'
    required: false
    default: 'false'
  fail_on_findings:
    description: 'Fail the workflow if P0-P2 findings exist'
    required: false
    default: 'true'
  language:
    description: 'Audit language (en/id)'
    required: false
    default: 'en'
  action:
    description: 'AURA action to run'
    required: false
    default: 'run'

outputs:
  convergence_score:
    description: 'Overall convergence score'
  audit_passed:
    description: 'Whether the convergence gate passed'
  p0_count:
    description: 'Number of open P0 findings'
  p1_count:
    description: 'Number of open P1 findings'
  p2_count:
    description: 'Number of open P2 findings'

runs:
  using: 'composite'
  steps:
    - name: Prepare AURA Engine
      id: aura-prepare
      shell: pwsh
      run: |
        $actionPath = "${{ github.action_path }}"
        $target = "${{ inputs.target }}"

        if ($target -eq ".") {
          $targetDir = Get-Location
        } else {
          $targetDir = Resolve-Path -LiteralPath $target
        }

        $auraDir  = Join-Path $targetDir ".aura"
        $modDir   = Join-Path $auraDir "modules"
        $langDir  = Join-Path $auraDir "lang"
        $engineDir = Join-Path $auraDir "engine"

        New-Item -ItemType Directory -Force -Path $modDir | Out-Null
        New-Item -ItemType Directory -Force -Path $langDir | Out-Null
        New-Item -ItemType Directory -Force -Path $engineDir | Out-Null

        $srcModules = Join-Path $actionPath "src\modules"
        if (Test-Path -LiteralPath $srcModules) {
          Copy-Item -LiteralPath "$srcModules\*.ps1" -Destination $modDir -Force
          Write-Host "[AURA ACTION] Copied modules to $modDir"
        } else {
          Write-Warning "[AURA ACTION] src/modules not found at $srcModules"
        }

        $srcLang = Join-Path $actionPath "src\lang"
        if (Test-Path -LiteralPath $srcLang) {
          Copy-Item -LiteralPath "$srcLang\*.json" -Destination $langDir -Force
          Write-Host "[AURA ACTION] Copied lang files to $langDir"
        }

        $engineScript = Join-Path $actionPath "src\engine\run-audit.ps1"
        if (Test-Path -LiteralPath $engineScript) {
          Copy-Item -LiteralPath $engineScript -Destination (Join-Path $engineDir "run-audit.ps1") -Force
          Write-Host "[AURA ACTION] Engine staged at $engineDir"
        } else {
          Write-Error "AURA engine not found at: $engineScript"
          exit 1
        }

        $stateDir = Join-Path $auraDir "state"
        New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
        $reportsDir = Join-Path $auraDir "reports"
        New-Item -ItemType Directory -Force -Path $reportsDir | Out-Null

    - name: Run AURA Audit
      id: aura-run
      shell: pwsh
      env:
        AURA_TARGET: ${{ inputs.target }}
        AURA_MULTI_AGENT: ${{ inputs.multi_agent }}
        AURA_LANGUAGE: ${{ inputs.language }}
        AURA_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
      run: |
        $action = "${{ inputs.action }}"
        $target = "${{ inputs.target }}"
        $lang = "${{ inputs.language }}"
        $multi = "${{ inputs.multi_agent }}" -eq "true"
        $failOnFindings = "${{ inputs.fail_on_findings }}" -eq "true"

        $args = @(
          "-Action", $action,
          "-TargetProject", $target,
          "-Language", $lang
        )
        if ($multi) { $args += "-MultiAgent" }

        if ($target -eq ".") {
          $targetDir = Get-Location
        } else {
          $targetDir = Resolve-Path -LiteralPath $target
        }

        $localScript = Join-Path $targetDir ".aura\engine\run-audit.ps1"

        if (!(Test-Path $localScript)) {
          Write-Error "AURA engine not staged at: $localScript"
          exit 1
        }

        Write-Host "Running AURA audit from: $targetDir"
        Write-Host "Action: $action | Target: $target | Language: $lang | Multi-Agent: $multi"

        & "pwsh" -NoProfile -File $localScript @args
        $exitCode = $LASTEXITCODE

        $findingsPath = Join-Path (Get-Location) ".aura/state/findings.json"
        $convergencePath = Join-Path (Get-Location) ".aura/state/convergence.json"

        $p0 = 0; $p1 = 0; $p2 = 0
        if (Test-Path $findingsPath) {
          $findingsRaw = Get-Content $findingsPath -Raw | ConvertFrom-Json
          $arr = if ($findingsRaw -is [array]) { $findingsRaw } else { $findingsRaw.findings }
          if ($null -ne $arr) {
            $open = $arr | Where-Object { $_.status -in @('OPEN','IN_PROGRESS') }
            $p0 = ($open | Where-Object { $_.severity -eq 'P0' }).Count
            $p1 = ($open | Where-Object { $_.severity -eq 'P1' }).Count
            $p2 = ($open | Where-Object { $_.severity -eq 'P2' }).Count
          }
        }

        $score = 0
        if (Test-Path $convergencePath) {
          $conv = Get-Content $convergencePath -Raw | ConvertFrom-Json
          $score = if ($conv.overall_score) { $conv.overall_score } else { 0 }
        }

        "convergence_score=$score" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        $gatePassed = ($p0 -eq 0 -and $p1 -eq 0 -and $p2 -eq 0)
        "audit_passed=$(if ($gatePassed) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "p0_count=$p0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "p1_count=$p1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "p2_count=$p2" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        if ($failOnFindings -and ($p0 -gt 0 -or $p1 -gt 0 -or $p2 -gt 0)) {
          Write-Error "AURA audit blocked: $p0 P0, $p1 P1, $p2 P2 findings remain"
          exit 1
        }

        if ($exitCode -ne 0 -and $exitCode -ne $null) {
          Write-Warning "AURA audit exited with code $exitCode"
          exit $exitCode
        }