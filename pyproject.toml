[project]
name = "aura-audit"
version = "2.1.2"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.scripts]
aura = "aura_cli:main"
aura-audit = "aura_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", ".aura*"]

[tool.setuptools.package-data]
"src" = ["agents/*.md", "lang/*.json", "modules/*.ps1"]

[pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]