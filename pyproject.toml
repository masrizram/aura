[project]
name = "aura-audit"
version = "3.5.3"
description = "AURA v3.5 — Autonomous Software Reliability Engine. Semantic code intelligence with 51 language groups (127 rules), AST (Python real, PHP/JS structural), heuristic taint analysis, framework-aware scoring, 40-domain audit registry, and 12-gate deterministic convergence."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AURA Engineering", email = "engineering@aura-audit.dev" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
db = [
    "aiosqlite>=0.20",
]
signing = [
    "cryptography>=42.0",
]
all = [
    "aura-audit[dev,db,signing]",
]

[project.scripts]
aura = "aura.cli:main"
aura-audit = "aura.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aura" = ["lang/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "C4", "UP", "SIM",
    "T20", "RUF", "S", "PLE", "PLC", "PLW", "RSE",
]
ignore = ["S101", "S104", "S301"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["src", ".git", "__pycache__", "*.egg-info", ".pytest_cache"]
addopts = ["-v", "--tb=short", "--strict-markers", "--ignore=src"]