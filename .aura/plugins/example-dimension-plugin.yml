name: "game-engine-dimensions"
version: "0.1.0"
plugin_type: dimension_weight
lifecycle: on_demand
author: "AURA Community"
description: "Dimension weights optimized for real-time game engine codebases. Performance and correctness receive higher weights, while documentation and operations are de-emphasized relative to defaults."

dimension_weights:
  Architecture: 0.10
  Correctness: 0.12
  Security: 0.08
  Reliability: 0.10
  Performance: 0.25
  Testing: 0.10
  Observability: 0.05
  Operations: 0.05
  Maintainability: 0.08
  Documentation: 0.07