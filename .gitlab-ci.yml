default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - audit
  - verify
  - report

variables:
  AURA_STATE_DIR: .aura/state
  AURA_REPORT_DIR: .aura/reports

cache:
  key: aura-state-$CI_COMMIT_REF_SLUG
  paths:
    - .aura/state/
    - .aura/reports/

.gated: &gated
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v.*/

aura:audit:
  stage: audit
  image: mcr.microsoft.com/powershell:latest
  <<: *gated
  before_script:
    - pwsh -Command "Write-Host 'AURA Audit Engine — Starting autonomous audit cycle'"
    - pwsh -Command "if (!(Test-Path 'src/engine/run-audit.ps1')) { Write-Error 'AURA engine not found'; exit 1 }"
  script:
    - pwsh -NoProfile -File src/engine/run-audit.ps1 -Action run
  artifacts:
    paths:
      - .aura/state/
      - .aura/reports/
    expire_in: 30 days
    when: always
    reports:
      dotenv: ara_audit.env
  after_script:
    - >
      pwsh -Command "
      \$findingsPath = '.aura/state/findings.json';
      if (Test-Path \$findingsPath) {
        \$f = Get-Content \$findingsPath -Raw | ConvertFrom-Json;
        \$arr = if (\$f -is [array]) { \$f } else { \$f.findings };
        if (\$null -ne \$arr) {
          \$open = \$arr | Where-Object { \$_.state -in @('OPEN','IN_PROGRESS') };
          Write-Host ('P0:{0} P1:{1} P2:{2} P3-P5:{3}' -f
            (\$open | Where-Object { \$_.severity -eq 'P0' }).Count,
            (\$open | Where-Object { \$_.severity -eq 'P1' }).Count,
            (\$open | Where-Object { \$_.severity -eq 'P2' }).Count,
            (\$open | Where-Object { \$_.severity -in @('P3','P4','P5') }).Count
          )
        }
      }
      "

aura:convergence:
  stage: verify
  image: mcr.microsoft.com/powershell:latest
  <<: *gated
  needs: ["aura:audit"]
  script:
    - pwsh -NoProfile -File src/engine/run-audit.ps1 -Action validate-state -ForceValidation
    - |
      pwsh -Command "
      \$convergencePath = '.aura/state/convergence.json';
      if (Test-Path \$convergencePath) {
        \$conv = Get-Content \$convergencePath -Raw | ConvertFrom-Json;
        Write-Host ('Convergence Score: {0}' -f \$conv.overall_score);
        Write-Host ('Convergence Achieved: {0}' -f \$conv.convergence_achieved);
        if (\$conv.convergence_achieved -ne \$true) {
          Write-Error 'Convergence gate not met';
          exit 1;
        }
      } else {
        Write-Warning 'No convergence state file found';
      }
      "

aura:scope-validation:
  stage: verify
  image: mcr.microsoft.com/powershell:latest
  <<: *gated
  needs: ["aura:audit"]
  allow_failure: true
  script:
    - pwsh -NoProfile -File src/engine/run-audit.ps1 -Action scope-check

aura:invariant-check:
  stage: verify
  image: mcr.microsoft.com/powershell:latest
  <<: *gated
  needs: ["aura:audit"]
  allow_failure: true
  script:
    - pwsh -NoProfile -File src/engine/run-audit.ps1 -Action invariant-check

aura:report:
  stage: report
  image: busybox:latest
  <<: *gated
  needs: ["aura:audit", "aura:convergence"]
  script:
    - echo "=== AURA Audit Report ==="
    - 'if [ -f .aura/reports/audit-ledger.md ]; then echo "Audit ledger present"; wc -l .aura/reports/audit-ledger.md; fi'
    - 'if [ -f .aura/reports/risk-register.md ]; then echo "Risk register present"; wc -l .aura/reports/risk-register.md; fi'
    - 'if [ -f .aura/reports/verification-matrix.md ]; then echo "Verification matrix present"; wc -l .aura/reports/verification-matrix.md; fi'
    - echo "=== End Report ==="
  artifacts:
    paths:
      - .aura/reports/
    expire_in: 90 days